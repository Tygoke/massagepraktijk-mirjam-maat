reviews:
  - quote: Erg fijn om lekker samen met je kind bezig te zijn en er ook thuis mee verder aan de slag te gaan. Heerlijk ontspannen en daarbij goede tips voor bij buikkrampjes en huilen.
    naam: Ellen
    plaats: Spoordonk
  - quote: Fien wordt helemaal rustig en ontspannen van een massage. Ook heeft de cursus van Mirjam mij — als kersverse moeder — meer zelfvertrouwen gegeven over omgaan met het lichaam van en bewegen met je baby. Echt een aanrader!
    naam: Imke
    plaats: Boxtel
  - quote: Cursus was super leuk, gezellig, interessant en leerzaam! Mirjam is flexibel en speelt goed in op de behoefte van je baby.
    naam: Esther
    plaats: Boxtel
  - quote: Ik heb de cursus heel gezellig en leuk gevonden en we kregen ook goede tips hoe om te gaan met je pasgeboren baby en leuke boekentips. De cursus was erg ontspannen en ik vind Mirjam een erg prettige instructrice! Mijn kindje genoot van de babymassage en ik masseer mijn kindje regelmatig!
    naam: Harriette
    plaats: Gemonde
  - quote: Tijdens de laatste les hebben we kaartjes getrokken met een woord erop. Ik trok het kaartje met 'waardevol' erop. En dat was de cursus zeker! Heerlijk zo'n ochtend samen met je baby. Echt quality time voor mama en baby. Waardevol voor nu en in de toekomst!
    naam: Marielle
    plaats: Boxtel
  - quote: Een moment om lekker met je kindje te tuttelen en met andere nieuwe mama's ervaringen uit te wisselen. Doordat je de massagetechnieken onder de knie hebt, maak ik ook thuis regelmatig tijd voor een fijne massage! Heerlijk!
    naam: Anika
    plaats: Boxtel
  - quote: Het is een geniet-moment, zowel voor mijn dochtertje als voor mezelf. Ze begint al te lachen als ik met masseren begin en dat stimuleert mij alleen maar om het regelmatig te doen!
    naam: Marleen
    plaats: Boxtel
  - quote: "De cursus was voor mij een leuke en ontspannen manier om samen met mijn dochtertje bezig te zijn. Quality time samen. Thuis zet ik het masseren nog lekker door: ze vindt het heerlijk!"
    naam: Amanda
    plaats: Boxtel
  - quote: De cursus babymassage van Mirjam Maat was een feestje, zowel voor mij als mijn dochtertje. We hebben samen intens genoten van de gezellige ochtenden en genieten nu thuis nog steeds van de geleerde massagetechnieken.
    naam: Manon
    plaats: Eindhoven
  - quote: Ik heb samen met Leen enorm genoten van de cursus babymassage! Ik zou het iedereen aanraden! Ons actieve mannetje sliep na de lessen heerlijk!
    naam: Annet
    plaats: Liempde
  - quote: De massage-cursus was een toppertje! Mijn baby en ik kwamen in een flow van genegenheid en ontspanning helemaal in contact met elkaar. Super om dit te mogen ervaren!
    naam: Célien
    plaats: Lennisheuvel
  - quote: De cursus babymassage was leerzaam, ontspannend en zeer gezellig en mijn manneke sliep naderhand heerlijk.
    naam: Linda
    plaats: Boxtel
  - quote: Heerlijk moment om even met z'n tweetjes te ontspannen, en thuis ging de rust door omdat ze nog uren sliep!!
    naam: Kim
    plaats: Liempde
  - quote: Leerzame cursus, mooie lesopbouw, heldere uitleg, prettige sfeer. Erg fijn en ontspannend voor je kindje en jezelf.
    naam: Sjarai
    plaats: Nijmegen
