backend:
  name: github
  repo: Tygoke/massagepraktijk-mirjam-maat
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

locale: nl
site_url: https://massagepraktijk-mirjam-maat.netlify.app
display_url: https://massagepraktijk-mirjam-maat.netlify.app
logo_url: /admin/logo.svg

media_folder: images
public_folder: /images

collections:
  - name: nieuws
    label: "Laatste nieuws & aanbod"
    description: "De berichten die op de pagina 'Nieuws' verschijnen."
    files:
      - name: berichten
        label: Nieuwsberichten
        file: data/nieuws.json
        preview_path: nieuws.html
        fields:
          - label: Berichten
            name: berichten
            widget: list
            summary: "{{fields.datum}} — {{fields.titel}}"
            fields:
              - label: Datum
                name: datum
                widget: string
                hint: "Hoe deze datum op de website staat. Bijv. 'Voorjaar 2026' of '1 april 2025'."
              - label: Label (optioneel)
                name: badge
                widget: string
                required: false
                hint: "Klein label boven de titel, bijv. 'Nieuw' of 'Let op'. Laat leeg voor geen label."
              - label: Kleur van het label
                name: badge_type
                widget: select
                required: false
                default: ""
                options:
                  - { label: "Groen (standaard, voor goed nieuws)", value: "" }
                  - { label: "Amber (voor een waarschuwing of mededeling)", value: "amber" }
              - label: Titel van het bericht
                name: titel
                widget: string
              - label: Tekst van het bericht
                name: tekst
                widget: text
                hint: "Gewone tekst. Voor een nieuwe alinea: laat een lege regel tussen de tekst."

  - name: tarieven
    label: Tarieven
    description: "De prijzen die op de pagina 'Tarieven' staan."
    files:
      - name: blokken
        label: Tarieven beheren
        file: data/tarieven.json
        preview_path: tarieven.html
        fields:
          - label: Tarievenblokken
            name: blokken
            widget: list
            summary: "{{fields.titel}}"
            fields:
              - label: Naam van de categorie
                name: titel
                widget: string
                hint: "Bijv. 'Oliemassages — 60 minuten'."
              - label: Beschikbaarheid
                name: status
                widget: select
                options:
                  - { label: "Open — nieuwe klanten welkom", value: "open" }
                  - { label: "Gesloten voor nieuwe klanten", value: "dicht" }
              - label: Toelichting bij de status
                name: statusmelding
                widget: string
                hint: "Een korte zin die uitlegt wat de status betekent."
              - label: Prijsregels
                name: prijzen
                widget: list
                summary: "{{fields.naam}} — {{fields.prijs}}"
                fields:
                  - { label: "Naam van de behandeling", name: naam, widget: string }
                  - { label: "Prijs (bijv. € 60,-)", name: prijs, widget: string }

  - name: massages
    label: Massages
    description: "De tekst en informatie op elke individuele massage-pagina."
    files:
      - name: shiatsutherapie
        label: "Shiatsu Therapie & Acupunctuur"
        file: data/massages/shiatsutherapie.json
        preview_path: shiatsutherapie.html
        fields: &massage_velden
          - label: Introductiezin (onder de titel)
            name: lead
            widget: string
          - label: Beschikbaarheid
            name: status_type
            widget: select
            options:
              - { label: "Open — nieuwe klanten welkom", value: "open" }
              - { label: "Gesloten — alleen bestaande klanten", value: "dicht" }
          - label: Tekst van het label
            name: status_label
            widget: string
            hint: "Bijv. 'Nieuwe klanten welkom' of 'Voor bestaande klanten'."
          - label: Foto (optioneel)
            name: afbeelding
            widget: image
            required: false
            hint: "Laat leeg voor geen foto bij deze pagina."
          - label: Hoofdtekst
            name: tekst
            widget: text
            hint: >
              Gewone tekst met eenvoudige opmaak. Nieuwe alinea = lege regel ertussen.
              Tussenkopje: begin een regel met '## ' (bijv. '## Welke klachten').
              Lijst: begin elke regel met '- '.
              Vetgedrukt: zet **twee sterretjes** om een woord.
              Link: [zichtbare tekst](pagina.html)
          - label: "'In het kort' — informatierijen"
            name: info
            widget: list
            summary: "{{fields.label}}: {{fields.waarde}}"
            fields:
              - { label: "Label", name: label, widget: string, hint: "Bijv. 'Duur' of 'Prijs'." }
              - { label: "Waarde", name: waarde, widget: string, hint: "Bijv. '60 minuten' of '€ 60'." }
          - label: Extra opmerking (optioneel)
            name: opmerking
            widget: string
            required: false
            hint: "Kleine grijze tekst onderaan de infobox, bijv. over een aanmeldstop. Laat leeg indien niet van toepassing."
      - name: shiatsu-massage
        label: "Shiatsu-massage"
        file: data/massages/shiatsu-massage.json
        preview_path: shiatsu-massage.html
        fields: *massage_velden
      - name: klassieke-massage
        label: "Klassieke & sportmassage"
        file: data/massages/klassieke-massage.json
        preview_path: klassieke-massage.html
        fields: *massage_velden
      - name: hoofdpijn-massage
        label: "Hoofdpijnmassage"
        file: data/massages/hoofdpijn-massage.json
        preview_path: hoofdpijn-massage.html
        fields: *massage_velden
      - name: zwangerschapsmassage
        label: "Zwangerschapsmassage"
        file: data/massages/zwangerschapsmassage.json
        preview_path: zwangerschapsmassage.html
        fields: *massage_velden
      - name: mama-massage
        label: "Mama-massage"
        file: data/massages/mama-massage.json
        preview_path: mama-massage.html
        fields: *massage_velden

  - name: meer
    label: "Meer (referenties, huisregels & links)"
    description: "Inhoud van de overige pagina's onder het menu 'Meer'."
    files:
      - name: referenties
        label: Referenties
        file: data/referenties.json
        preview_path: referenties.html
        fields:
          - label: Reacties
            name: reviews
            widget: list
            summary: "{{fields.naam}}, {{fields.plaats}}"
            fields:
              - { label: "Reactie", name: quote, widget: text }
              - { label: "Naam", name: naam, widget: string }
              - { label: "Woonplaats", name: plaats, widget: string }

      - name: huisregels
        label: Huisregels
        file: data/huisregels.json
        preview_path: huisregels.html
        fields:
          - label: Regels
            name: regels
            widget: list
            summary: "{{fields.titel}}"
            fields:
              - { label: "Titel van de regel", name: titel, widget: string, hint: "Wordt vetgedrukt getoond, bijv. 'Enkel op afspraak.'" }
              - { label: "Toelichting", name: tekst, widget: text }

      - name: links
        label: Links
        file: data/links.json
        preview_path: links.html
        fields:
          - label: Linkkaarten
            name: links
            widget: list
            summary: "{{fields.titel}}"
            fields:
              - { label: "Categorie", name: categorie, widget: string, hint: "Klein label boven de titel, bijv. 'Social media'." }
              - { label: "Titel", name: titel, widget: string }
              - { label: "Omschrijving", name: tekst, widget: text }
              - { label: "Link (URL)", name: url, widget: string, hint: "Volledige link (https://...) of een pagina op deze site (bijv. contact.html)." }
              - { label: "Zichtbare linktekst", name: label, widget: string, hint: "Bijv. 'facebook.com/massagepraktijkmm' of 'Naar contact'." }
